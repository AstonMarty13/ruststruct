[package]
name = "ruststruct"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A tiny, dependency-light CLI that scaffolds a standard Rust project layout in one command."
authors = ["Marty Faivre <marty.faivre@am-vintage.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/AstonMarty13/ruststruct"
homepage = "https://github.com/AstonMarty13/ruststruct"
keywords = ["cli", "scaffold", "generator", "boilerplate", "template"]
categories = ["command-line-utilities", "development-tools::cargo-plugins"]

[lib]
name = "ruststruct"
path = "src/lib.rs"

[[bin]]
name = "ruststruct"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"

[dev-dependencies]
assert_cmd = "2.2.2"
assert_fs = "1.1.4"
predicates = "3.1.4"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
